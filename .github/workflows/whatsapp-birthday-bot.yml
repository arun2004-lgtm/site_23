name: 🎂 E/23 WhatsApp Midnight Birthday Bot

on:
  schedule:
    # 18:30 UTC = 00:00:00 (12:00 AM midnight) Sri Lanka Standard Time (Asia/Colombo UTC+5:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  birthday-check:
    name: Check & Send Birthday Wishes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Run Midnight Birthday Bot
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://drpjcnanbntscabnocvd.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_bQ7SwKgJ8vj5x5QoprBUaA_JtY-ePUx' }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: node scripts/whatsapp-birthday-bot/run-birthday-bot.cjs --today
